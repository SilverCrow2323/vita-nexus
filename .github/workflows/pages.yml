name: Deploy VITA NEXUS Web

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows:
      - Sync public catalog metadata
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate web companion and native guide
        run: |
          test -s web/index.html
          test -s web/catalog.html
          test -s web/docs.html
          python3 -m json.tool web/data/catalog.json > /dev/null
          grep -q 'Five screens' web/docs.html
          grep -q 'DEVICE VISUAL RECHECK PENDING' web/docs.html

  deploy:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: web/

      - name: Allow Pages artifact metadata to settle
        run: sleep 5

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
