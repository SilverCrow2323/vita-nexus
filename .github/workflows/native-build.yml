name: VITA NEXUS native Vita build

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "tools/catalog-builder/build_native_index.py"
      - "web/data/catalog.json"
      - ".github/workflows/native-build.yml"
      - "tools/verify_vpk.py"
  pull_request:
    paths:
      - "native/**"
      - "tools/catalog-builder/build_native_index.py"
      - "web/data/catalog.json"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test shared native catalog index
        run: |
          python3 tools/catalog-builder/build_native_index.py web/data/catalog.json native/generated/catalog_index.c
          python3 -m unittest discover -s tools/catalog-builder -p 'test_build_native_index.py' -v

      - name: Build with pinned VitaSDK container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            sh -lc 'vdpm install libvita2d && cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" && cmake --build native/build --parallel 2'

      - name: Verify VPK artifact exists
        run: test -s native/build/vita_nexus_native.vpk

      - name: Verify VPK integrity, Title ID and payload boundary
        run: python3 tools/verify_vpk.py native/build/vita_nexus_native.vpk --title-id VNXS00001

      - name: Record VPK checksum
        run: |
          sha256sum native/build/vita_nexus_native.vpk
          echo "Native VPK SHA-256: $(sha256sum native/build/vita_nexus_native.vpk)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: vita-nexus-native-alpha
          path: native/build/vita_nexus_native.vpk
          if-no-files-found: error
          retention-days: 14
