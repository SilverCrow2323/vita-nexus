name: VITA NEXUS native Vita build

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-vpk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with pinned VitaSDK container
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            sh -lc 'vdpm install libvita2d && cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" && cmake --build native/build --parallel 2'

      - name: Verify VPK artifact exists
        run: test -s native/build/vita_nexus_native.vpk

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vita-nexus-native-alpha
          path: native/build/vita_nexus_native.vpk
          if-no-files-found: error
          retention-days: 14
