name: VITA NEXUS quality checks

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "catalog/schema/**"
      - "tools/catalog-builder/**"
      - "tests/**"
      - "native/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "web/**"
      - "catalog/schema/**"
      - "tools/catalog-builder/**"
      - "tests/**"
      - "native/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate JSON documents
        run: |
          python -m json.tool catalog/schema/catalog.schema.json > /dev/null
          python -m json.tool web/data/catalog.json > /dev/null
          python -m json.tool web/data/editorial-overrides.json > /dev/null

      - name: Test catalog importer
        working-directory: tools/catalog-builder
        run: python -m unittest -v

      - name: Validate public catalog data
        run: python tools/catalog-builder/validate_catalog.py web/data/catalog.json

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/catalog.js
          node --check web/lists.js

      - name: Test browser catalog logic
        run: node --test tests/*.test.cjs

      - name: Build native Vita VPK (pull requests)
        if: github.event_name == 'pull_request' && hashFiles('native/CMakeLists.txt') != ''
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            vitasdk/vitasdk:2026.08 \
            sh -lc 'vdpm install libvita2d && cmake -S native -B native/build -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" && cmake --build native/build --parallel 2'

      - name: Verify native VPK
        if: github.event_name == 'pull_request' && hashFiles('native/CMakeLists.txt') != ''
        run: test -s native/build/vita_nexus_native.vpk

      - name: Upload native VPK validation artifact
        if: github.event_name == 'pull_request' && hashFiles('native/CMakeLists.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vita-nexus-native-pr-check
          path: native/build/vita_nexus_native.vpk
          if-no-files-found: error
          retention-days: 7

