name: Sync public catalog metadata

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test catalog importer
        working-directory: tools/catalog-builder
        run: python -m unittest -v

      - name: Import public metadata indexes
        run: python tools/catalog-builder/import_nps_tsv.py --output web/data/catalog.json

      - name: Commit catalog snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog snapshot is already up to date."
            exit 0
          fi
          git commit -m "data: refresh public game catalog"
          git push
